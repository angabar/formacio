<html>
    <head>
        <title>Photo carousel</title>
        <script>
            class PhotoCarousel extends HTMLElement {
                connectedCallback() {
                    this._photoIndex = 0;
                    this._photos = this.getAttribute("photos")?.split(",");

                    this.innerHTML = `
                        <h2>${this.getAttribute("title")}</h2>
                        <h4>${this.getAttribute("author")}</h4>
                        <div class="image-container"></div>
                        <button class="back">&lt</button>
                        <button class="forward">&gt</button>
                    `;

                    this.showPhoto();

                    this.querySelector("button.back").addEventListener(
                        "click",
                        // Importante que sea una función flecha, una función normal coje el this de donde se llama, una función flecha coje el this de donde se declara
                        (event) => {
                            this.onBackButtonClick(event);
                        },
                    );
                    this.querySelector("button.forward").addEventListener(
                        "click",
                        (event) => {
                            this.onNextButtonClick(event);
                        },
                    );
                }

                showPhoto() {
                    this.querySelector(
                        ".image-container",
                    ).style.backgroundImage =
                        `url(${this._photos[this._photoIndex]})`;
                }

                onBackButtonClick(event) {
                    this._photoIndex--;

                    if (this._photoIndex < 0) {
                        this._photoIndex = this._photos.length - 1;
                    }

                    this.showPhoto();
                }

                onNextButtonClick(event) {
                    this._photoIndex++;

                    if (this._photoIndex >= this._photos.length) {
                        this._photoIndex = 0;
                    }

                    this.showPhoto();
                }
            }

            if (!customElements.get("wcia-photo-carousel")) {
                customElements.define("wcia-photo-carousel", PhotoCarousel);
            }
        </script>
        <style>
            wcia-photo-carousel {
                position: relative;
                width: 500px;
                height: 300px;
                display: flex;
                padding-top: 10px;
                flex-direction: column;
                border-color: black;
                border-width: 1px;
                border-style: solid;
            }

            wcia-photo-carousel h2,
            h4 {
                margin-bottom: 0px;
                margin-top: 0;
                margin-left: 10px;
            }

            wcia-photo-carousel .image-container {
                margin-top: 15px;
                flex: 1;
                background-color: black;
                background-size: contain;
                background-repeat: no-repeat;
                background-position: 50%;
            }

            wcia-photo-carousel button {
                cursor: pointer;
                background-color: transparent;
                border: none;
                font-size: 48px;
                color: white;
                position: absolute;
                top: 50%;
            }

            wcia-photo-carousel button.back {
                left: 10px;
            }

            wcia-photo-carousel button.forward {
                right: 10px;
            }
        </style>
    </head>
    <body>
        <wcia-photo-carousel
            title="jajaja"
            author="author name!"
            photos="https://picsum.photos/id/237/200/300,https://picsum.photos/id/238/200/300,https://picsum.photos/id/239/200/300,https://picsum.photos/id/240/200/300"
        ></wcia-photo-carousel>
    </body>
</html>
