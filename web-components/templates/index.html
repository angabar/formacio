<html>
    <body>
        <template id="button">
            <button>Click me</button>
            <p>This is a template with a button</p>
        </template>

        <template id="textfield">
            <label>Enter</label>
            <input type="text" />
            <p>This is a template with a text input</p>
        </template>

        <template id="list">
            <ul>
                <li>Item 1</li>
                <li>Item 2</li>
            </ul>
        </template>

        <script>
            // El proceso de traer una template (renderizado temporal fuera del
            // DOM) ha de hacerse mediante un clonado, de lo contrario la
            // información se perderá y no se inyectará correctamente en el DOM
            const template = document.getElementById("button");
            const clone = template.content.cloneNode(true);
            document.body.appendChild(clone);
        </script>
    </body>
</html>
