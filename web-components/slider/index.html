<html>
    <body>
        <wcia-slider backgroundColor="#0000ff" value="10"></wcia-slider>
    </body>
    <script>
        class WCIASlider extends HTMLElement {
            connectedCallback() {
                this.innerHTML =
                    "<div class='bg-overlay'></div><div class='thumb'></div>";

                // this.style.height = "50px";

                // this.getAttribute("backgroundColor");

                // this.querySelector(".bg-overlay").style.width = "100%";
            }
        }

        if (!customElements.get("wcia-slider")) {
            customElements.define("wcia-slider", WCIASlider);
        }
    </script>
    <style>
        wcia-slider {
            display: inline-block;
            position: relative;
            border-radius: 3px;
            height: 50px;
            width: 500px;
        }

        .bg-overlay {
            width: 100%;
            height: 100%;
            position: absolute;
            border-radius: 3px;
            background-color: red;
        }

        .thumb {
            margin-top: -1px;
            left: 250px;
            width: 5px;
            height: calc(100% - 5px);
            position: absolute;
            border-style: solid;
            border-width: 3px;
            border-color: white;
            border-radius: 3px;
            pointer-events: none;
        }
    </style>
</html>
