<html>
    <head>
        <style>
            wcia-slider {
                display: inline-block;
                position: relative;
                border-radius: 3px;
                height: 50px;
                width: 400px;
            }

            .bg-overlay {
                width: 100%;
                height: 100%;
                position: absolute;
                border-radius: 3px;
                background-color: red;
            }

            .thumb {
                margin-top: -1px;
                width: 5px;
                height: calc(100% - 5px);
                position: absolute;
                border-style: solid;
                border-width: 3px;
                border-color: white;
                border-radius: 3px;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <wcia-slider backgroundcolor="#0000ff" value="20"></wcia-slider>
    </body>
    <script>
        class WCIASlider extends HTMLElement {
            #isDragging = false;

            connectedCallback() {
                this.innerHTML =
                    "<div class='bg-overlay'></div><div class='thumb'></div>";

                // Tenemos que llamar a estos métodos porque sino no se setearán los valores la primera vez, ya que aunque attributeChangedCallback también se llama al inicio, cuando lo hace, los componentes aún no han cargado, mientras que en el connectedCallback si
                this.setColor(this.backgroundcolor);
                this.refreshSlider(this.value);

                // Para inicializar el movimiento tenemos que hacer click en el slider, pero para moverlo o soltarlo podemos estar fuera, por eso el mousedown está definido en el componente, pero los demás fuera de este
                this.addEventListener("mousedown", (event) =>
                    this.eventHandler(event),
                );

                document.addEventListener("mouseup", (event) =>
                    this.eventHandler(event),
                );
                document.addEventListener("mousemove", (event) =>
                    this.eventHandler(event),
                );
            }

            static get observedAttributes() {
                return ["value", "backgroundcolor"];
            }

            attributeChangedCallback(name, oldVal, newVal) {
                switch (name) {
                    case "value":
                        this.refreshSlider(newVal);
                        break;

                    case "backgroundcolor":
                        this.setColor(newVal);
                        break;
                }
            }

            get value() {
                return this.getAttribute("value");
            }

            set value(newVal) {
                this.setAttribute("value", newVal);
            }

            get backgroundcolor() {
                return this.getAttribute("backgroundcolor");
            }

            set backgroundcolor(newVal) {
                this.setAttribute("backgroundcolor", newVal);
            }

            refreshSlider(newVal) {
                if (this.querySelector(".thumb")) {
                    this.querySelector(".thumb").style.left =
                        `${(newVal / 100) * this.offsetWidth - this.querySelector(".thumb").offsetWidth / 2}px`;
                }
            }

            setColor(newVal) {
                if (this.querySelector(".bg-overlay")) {
                    this.querySelector(".bg-overlay").style.background = newVal;
                }
            }

            updateX(x) {
                let hPos = x - this.querySelector(".thumb").offsetWidth / 2;

                if (hPos > this.offsetWidth) {
                    hPos = this.offsetWidth;
                }

                if (hPos < 0) {
                    hPos = 0;
                }

                this.value = (hPos / this.offsetWidth) * 100;
            }

            eventHandler(event) {
                const bounds = this.getBoundingClientRect();
                const x = event.clientX - bounds.left;

                switch (event.type) {
                    case "mousedown":
                        this.#isDragging = true;
                        this.updateX(x);
                        this.refreshSlider(this.value);
                        break;
                    case "mouseup":
                        this.#isDragging = false;
                        break;
                    case "mousemove":
                        if (this.#isDragging) {
                            this.updateX(x);
                            this.refreshSlider(this.value);
                            break;
                        }
                }
            }
        }

        if (!customElements.get("wcia-slider")) {
            customElements.define("wcia-slider", WCIASlider);
        }
    </script>
</html>
